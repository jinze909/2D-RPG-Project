name: RPG Project Validation and ZIP

on:
  push:
    branches: [master, main, 'rpg/iteration-*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rpg-validation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-and-package:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out the complete Unity project
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          lfs: true
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install signed distribution compiler packages and image verifier
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y mono-devel
          python3 -m pip install --disable-pip-version-check Pillow==12.3.0
      - name: Validate actual project sources and resource references
        id: validate
        run: |
          mkdir -p "$RUNNER_TEMP/rpg-validation"
          python3 tools/validate_project.py --root "$GITHUB_WORKSPACE" --output "$RUNNER_TEMP/rpg-validation/project-report.json"
      - name: Verify project packaging boundaries
        id: distribution
        run: |
          set -euo pipefail
          report_failure() {
            python3 - "$1" <<'PY'
          import sys
          from pathlib import Path
          detail = Path(sys.argv[1]).read_text()[-2500:]
          detail = detail.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          print('::error title=RPG boundary test failure::' + detail)
          PY
          }
          if ! python3 -m unittest discover -s tests -p 'test_distribution.py' -v 2>&1 | tee "$RUNNER_TEMP/rpg-validation/distribution-tests.txt"; then
            report_failure "$RUNNER_TEMP/rpg-validation/distribution-tests.txt"
            exit 1
          fi
      - name: Package the complete project without Unity caches
        if: steps.validate.outcome == 'success' && steps.distribution.outcome == 'success'
        run: |
          python3 tools/package_unity_project.py --root "$GITHUB_WORKSPACE" --output "$RUNNER_TEMP/rpg-validation/2D-RPG-Project-${GITHUB_SHA}.zip"
      - name: Upload project ZIP and verification report
        id: artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: unity-project-${{ github.sha }}
          path: ${{ runner.temp }}/rpg-validation/
          if-no-files-found: error
          retention-days: 30
      - name: Publish the real download entry
        if: always()
        env:
          ARTIFACT_URL: ${{ steps.artifact.outputs.artifact-url }}
          VALIDATION_OUTCOME: ${{ steps.validate.outcome }}
          DISTRIBUTION_OUTCOME: ${{ steps.distribution.outcome }}
        run: |
          {
            echo '## Project verification and delivery'
            echo "Commit: $GITHUB_SHA"
            echo "Offline project validation: $VALIDATION_OUTCOME"
            echo "Distribution boundary tests: $DISTRIBUTION_OUTCOME"
            echo 'Native Unity Editor import, EditMode/PlayMode and playback: not run on this runner.'
            if [ -n "$ARTIFACT_URL" ]; then
              echo "[Download the uploaded artifact]($ARTIFACT_URL)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
